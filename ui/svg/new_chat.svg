<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="newGrad" x1="25" y1="25" x2="75" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#6A5CFF"/>
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#newGrad)" stroke-width="6"/>
  
  <!-- Plus sign -->
  <line x1="50" y1="35" x2="50" y2="65" stroke="#00D9FF" stroke-width="6" stroke-linecap="round"/>
  <line x1="35" y1="50" x2="65" y2="50" stroke="#00D9FF" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Small accent dots -->
  <circle cx="75" cy="32" r="4" fill="#6A5CFF"/>
  <circle cx="28" cy="70" r="4" fill="#00D9FF"/>
</svg>