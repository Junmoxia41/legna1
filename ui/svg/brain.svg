<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="brainGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#6A5CFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main brain shape -->
  <path d="M25 35 Q30 20 50 25 Q70 20 75 35 Q85 45 78 60 Q85 75 65 80 Q50 88 35 80 Q20 75 25 55 Q18 45 25 35" 
        fill="none" stroke="url(#brainGrad)" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Neural connections -->
  <circle cx="35" cy="42" r="4" fill="#00D9FF"/>
  <circle cx="50" cy="35" r="4" fill="#00D9FF"/>
  <circle cx="65" cy="48" r="4" fill="#6A5CFF"/>
  <circle cx="42" cy="60" r="4" fill="#00D9FF"/>
  <circle cx="58" cy="65" r="4" fill="#6A5CFF"/>
  
  <!-- Connection lines -->
  <path d="M35 42 L50 35" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.7"/>
  <path d="M50 35 L65 48" fill="none" stroke="#6A5CFF" stroke-width="1.5" opacity="0.7"/>
  <path d="M35 42 L42 60" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.7"/>
  <path d="M42 60 L58 65" fill="none" stroke="#6A5CFF" stroke-width="1.5" opacity="0.7"/>
  <path d="M58 65 L65 48" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Highlight glow -->
  <circle cx="50" cy="52" r="18" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.15"/>
</svg>