<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="codeGrad" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#6A5CFF"/>
    </linearGradient>
  </defs>
  
  <!-- Editor window frame -->
  <rect x="12" y="18" width="76" height="64" rx="6" ry="6" 
        fill="none" stroke="url(#codeGrad)" stroke-width="5"/>
  
  <!-- Title bar -->
  <rect x="12" y="18" width="76" height="14" rx="6" ry="6" fill="#0A0B10"/>
  <circle cx="22" cy="25" r="3" fill="#FF5F56"/>
  <circle cx="32" cy="25" r="3" fill="#FFBD2E"/>
  <circle cx="42" cy="25" r="3" fill="#27C93F"/>
  
  <!-- Code lines -->
  <line x1="22" y1="42" x2="45" y2="42" stroke="#00D9FF" stroke-width="2.5"/>
  <line x1="22" y1="52" x2="60" y2="52" stroke="#6A5CFF" stroke-width="2.5"/>
  <line x1="22" y1="62" x2="38" y2="62" stroke="#00D9FF" stroke-width="2.5"/>
  <line x1="48" y1="62" x2="72" y2="62" stroke="#6A5CFF" stroke-width="2.5"/>
  
  <!-- Cursor -->
  <rect x="62" y="50" width="2" height="14" fill="#00D9FF"/>
</svg>