<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegnaCode - Monaco Editor</title>
    <style>
        body { 
            margin: 0; 
            background: #0A0B10; 
            color: #E0E6ED; 
            font-family: system-ui;
            overflow: hidden;
        }
        #container { height: 100vh; width: 100%; }
        .monaco-loading { 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; color: #00D9FF; font-size: 18px;
        }
        .monaco-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 32px;
            background: #05060A;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 12px;
            z-index: 100;
            border-bottom: 1px solid #1F2633;
        }
    </style>
    <!-- Monaco Editor from CDN -->
    <link rel="stylesheet" data-name="vs/editor/editor.main" 
          href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
</head>
<body>
    <div class="monaco-header">
        <span id="file-info">LegnaCode Editor</span>
    </div>
    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script>
        require.config({ 
            paths: { 
                'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' 
            }
        });

        let editor;
        let currentLanguage = 'python';

        // Language mapping from file extension
        const languageMap = {
            '.py': 'python',
            '.js': 'javascript',
            '.mjs': 'javascript',
            '.ts': 'typescript',
            '.tsx': 'typescript',
            '.html': 'html',
            '.htm': 'html',
            '.css': 'css',
            '.scss': 'scss',
            '.less': 'less',
            '.json': 'json',
            '.md': 'markdown',
            '.markdown': 'markdown',
            '.java': 'java',
            '.cs': 'csharp',
            '.cpp': 'cpp',
            '.c': 'c',
            '.h': 'c',
            '.go': 'go',
            '.rs': 'rust',
            '.php': 'php',
            '.sql': 'sql',
            '.yaml': 'yaml',
            '.yml': 'yaml',
            '.xml': 'xml',
            '.sh': 'shell',
            '.bash': 'shell',
            '.vue': 'vue',
            '.jsx': 'javascript',
            '.rb': 'ruby',
            '.swift': 'swift',
            '.kt': 'kotlin',
            '.dart': 'dart',
            '.r': 'r',
            '.lua': 'lua',
            '.pl': 'perl',
            '.scala': 'scala'
        };

        function detectLanguage(filename) {
            if (!filename) return 'plaintext';
            const ext = filename.toLowerCase().substring(filename.lastIndexOf('.'));
            return languageMap[ext] || 'plaintext';
        }

        require(['vs/editor/editor.main'], function() {
            // Create editor
            editor = monaco.editor.create(document.getElementById('container'), {
                value: '// Bienvenido a LegnaCode\n// Monaco Editor con soporte completo de lenguajes',
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: true },
                scrollBeyondLastLine: false,
                wordWrap: 'on',
                lineNumbers: 'on',
                renderLineHighlight: 'all',
                cursorBlinking: 'smooth'
            });

            window.legnaMonacoEditor = editor;

            // Notify parent that editor is ready
            window.parent.postMessage({ type: 'monaco_ready' }, '*');

            // Try to get filename from URL hash (e.g. #file=main.py)
            const hash = window.location.hash.substring(1);
            if (hash.startsWith('file=')) {
                const filename = decodeURIComponent(hash.split('=')[1]);
                const lang = detectLanguage(filename);
                monaco.editor.setModelLanguage(editor.getModel(), lang);
                document.getElementById('file-info').innerText = `${filename} (${lang})`;
                currentLanguage = lang;
            }
        });

        // === Communication with Python ===
        window.addEventListener('message', function(event) {
            const data = event.data;
            
            if (data.type === 'load_file') {
                if (editor && data.content !== undefined) {
                    const lang = data.language || detectLanguage(data.filename);
                    editor.setValue(data.content);
                    monaco.editor.setModelLanguage(editor.getModel(), lang);
                    currentLanguage = lang;
                    
                    document.getElementById('file-info').innerText = 
                        `${data.filename || 'untitled'} (${lang})`;
                }
            }
            
            if (data.type === 'set_language') {
                if (editor) {
                    monaco.editor.setModelLanguage(editor.getModel(), data.language);
                    currentLanguage = data.language;
                }
            }
        });

        // Expose functions for Python
        window.getEditorContent = function() {
            return editor ? editor.getValue() : '';
        };

        window.setEditorContent = function(content, filename = '') {
            if (editor) {
                editor.setValue(content);
                const lang = detectLanguage(filename);
                monaco.editor.setModelLanguage(editor.getModel(), lang);
                document.getElementById('file-info').innerText = 
                    `${filename} (${lang})`;
            }
        };

        window.getCurrentLanguage = function() {
            return currentLanguage;
        };
    </script>
</body>
</html>
