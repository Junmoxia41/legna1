<!doctype html><html lang="es"><head><meta charset="utf-8"><title>LEGNA Terminal</title><style>:root{--c:#00d9ff;--bg:#020409}*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#00d9ff #07111b}*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:#07111b}*::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00d9ff,#286f91);border:2px solid #07111b;border-radius:8px}*::-webkit-scrollbar-thumb:hover{background:#8ff4ff}body{margin:0;height:100vh;background:var(--bg);color:#d9f8ff;font:13px Consolas,monospace;display:flex;flex-direction:column}.head{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #173345;color:var(--c);font-weight:bold;letter-spacing:1px}.head span{margin-left:auto;color:#8ca1b2;font-size:11px}.out{flex:1;margin:0;padding:14px;overflow:auto;white-space:pre-wrap;color:#b8f3cb}.input{display:flex;gap:8px;padding:10px;border-top:1px solid #173345}.input input{flex:1;background:#07111b;border:1px solid #21475c;border-radius:6px;color:white;padding:10px;font:13px Consolas,monospace;outline:0}.input button{background:var(--c);border:0;border-radius:6px;padding:0 16px;font-weight:bold;cursor:pointer}</style></head><body><div class="head">LEGNA TERMINAL <span id="mode">Cargando…</span></div><pre id="out" class="out">Terminal lista.</pre><div class="input"><input id="cmd" placeholder="Escribe un comando explícito" autofocus><button id="run">EJECUTAR</button></div><script>const out=document.getElementById('out'),cmd=document.getElementById('cmd');async function run(){const text=cmd.value.trim();if(!text)return;out.textContent+='\n> '+text+'\n';cmd.value='';try{const r=await window.pywebview.api.terminal_run(text);out.textContent+=(r.output||'(sin salida)')+'\n';}catch(e){out.textContent+='Error: '+e.message+'\n'}out.scrollTop=out.scrollHeight}document.getElementById('run').onclick=run;cmd.onkeydown=e=>{if(e.key==='Enter')run()};window.addEventListener('pywebviewready',async()=>{const x=await window.pywebview.api.terminal_info();document.getElementById('mode').textContent=x.mode==='admin'?'ADMINISTRADOR':'ESTÁNDAR'})</script></body></html>
